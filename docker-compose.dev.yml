# Локальная разработка: только инфраструктура. Приложение — `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaybik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaybik_dev}
      POSTGRES_DB: ${POSTGRES_DB:-vaybik_admin}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  # Опционально: docker-socket-proxy для фазы 2 (DOCKER_HOST=tcp://127.0.0.1:2375)
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    profiles: ["docker"]
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      IMAGES: "1"
      EXEC: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      SWARM: "0"
      SECRETS: "0"
      BUILD: "0"
      PLUGINS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"

volumes:
  pgdata_dev:
