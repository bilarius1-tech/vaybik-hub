# Прод-развёртывание vaybik-hub.
# Деплой — только человек по docs/DEPLOY.md.
# НЕ трогать: VPN (Amnezia/Xray/WG), acme.json, конфиг Traefik, firewall, sshd.
#
# Сеть Traefik (external), certresolver и host — из .env.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_THEME_VARIANT: ${NEXT_PUBLIC_THEME_VARIANT:-A}
    image: vaybik-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DOCKER_HOST: tcp://docker-proxy:2375
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
      APP_URL: https://${TRAEFIK_ADMIN_HOST:-vaybik.ru}/admin
      NODE_ENV: production
      APP_ENV: prod
    command: ["node", "server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      # Канон на VPS: /var/backups/vaybik (chmod 700, uid 1001). Создаётся при деплое.
      - ${BACKUPS_HOST_DIR:-/var/backups/vaybik}:/app/backups
    networks: [hub, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      # HTTPS — приоритет выше роутера заглушки nginx
      - traefik.http.routers.vaybik-admin.rule=Host(`${TRAEFIK_ADMIN_HOST:-vaybik.ru}`) && PathPrefix(`/admin`)
      - traefik.http.routers.vaybik-admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.vaybik-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.vaybik-admin.priority=${TRAEFIK_ADMIN_PRIORITY:-100}
      - traefik.http.services.vaybik-admin.loadbalancer.server.port=3000
      # HTTP → HTTPS (middleware уже на сервере)
      - traefik.http.routers.vaybik-admin-http.rule=Host(`${TRAEFIK_ADMIN_HOST:-vaybik.ru}`) && PathPrefix(`/admin`)
      - traefik.http.routers.vaybik-admin-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.vaybik-admin-http.middlewares=${TRAEFIK_HTTPS_REDIRECT_MIDDLEWARE:-to-https@docker}
      - traefik.http.routers.vaybik-admin-http.priority=${TRAEFIK_ADMIN_PRIORITY:-100}
      - traefik.http.routers.vaybik-admin-http.service=vaybik-admin

  worker:
    image: vaybik-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DOCKER_HOST: tcp://docker-proxy:2375
      UPLOADS_DIR: /app/uploads
      BACKUPS_DIR: /app/backups
      NODE_ENV: production
      APP_ENV: prod
    command: ["node", "worker.cjs"]
    # Образ наследует HEALTHCHECK app (curl :3000), а worker HTTP не слушает —
    # проверяем, что процесс worker жив (PID 1) и БД доступна.
    healthcheck:
      test: ["CMD-SHELL", "grep -q worker.cjs /proc/1/cmdline && pg_isready -h postgres -U $$POSTGRES_USER -q"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      app:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      - ${BACKUPS_HOST_DIR:-/var/backups/vaybik}:/app/backups
      # Метрики хоста: /proc (CPU/RAM/сеть), /var → /host/disk для df (не весь /)
      - /proc:/host/proc:ro
      - /var:/host/disk:ro
    networks: [hub]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [hub]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ограниченный Docker API (фаза 2). Без портов наружу и без сети Traefik.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      POST: "1"
      ALLOW_RESTARTS: "1"
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      IMAGES: "1"
      EXEC: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      SWARM: "0"
      SECRETS: "0"
      BUILD: "0"
      PLUGINS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [hub]

  # Публичный рендер CMS (site-test / cutover). Тот же образ, без миграций.
  site:
    image: vaybik-hub:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SITE_DATABASE_URL: ${SITE_DATABASE_URL:-}
      UPLOADS_DIR: /app/uploads
      SITE_CACHE_DIR: /app/site-cache
      SITE_PORT: "3100"
      SITE_PUBLIC_ORIGIN: ${SITE_PUBLIC_ORIGIN:-https://vaybik.ru}
      SITE_ASSETS_ORIGIN: ${SITE_ASSETS_ORIGIN:-https://vaybik.ru}
      SITE_STATIC_PROXY: ${SITE_STATIC_PROXY:-http://vaybik-main:80}
      NODE_ENV: production
      APP_ENV: prod
      NODE_OPTIONS: ${SITE_NODE_OPTIONS:---max-old-space-size=192}
    command: ["node", "site.cjs"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - uploads:/app/uploads:ro
      - site-cache:/app/site-cache
    networks: [hub, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - vaybik.managed=true
      # Прод: выключен при SITE_PROD_PRIORITY=1 (проигрывает vaybik-main=17); cutover → 50
      - traefik.http.routers.vaybik-site.rule=Host(`${TRAEFIK_ADMIN_HOST:-vaybik.ru}`) && !PathPrefix(`/admin`) && !PathPrefix(`/css/`) && !PathPrefix(`/js/`) && !PathPrefix(`/fonts/`) && !PathPrefix(`/img/`) && !PathPrefix(`/kp/`) && !Path(`/studio-preview.html`)
      - traefik.http.routers.vaybik-site.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.vaybik-site.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.routers.vaybik-site.priority=${SITE_PROD_PRIORITY:-1}
      - traefik.http.routers.vaybik-site.service=vaybik-site
      - traefik.http.services.vaybik-site.loadbalancer.server.port=3100

networks:
  hub:
    driver: bridge
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  pgdata:
  uploads:
  site-cache:
