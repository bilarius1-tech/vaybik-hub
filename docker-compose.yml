# Скелет продакшн-развёртывания (дорабатывается в Фазе 1d, см. docs/TZ.md).
# Деплой выполняет человек вручную. VPN, acme.json и конфиг Traefik не трогать.
services:
  app:
    build: .
    image: vaybik-hub:latest
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres]
    networks: [internal, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.vaybik-admin.rule=Host(`${TRAEFIK_ADMIN_HOST}`) && PathPrefix(`/admin`)
      - traefik.http.routers.vaybik-admin.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.vaybik-admin.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.vaybik-admin.priority=100
      - traefik.http.services.vaybik-admin.loadbalancer.server.port=3000

  worker:
    image: vaybik-hub:latest
    restart: unless-stopped
    env_file: .env
    command: ["node", "worker.js"]   # уточняется в Фазе 1
    depends_on: [postgres, docker-proxy]
    networks: [internal]
    volumes:
      - /proc:/host/proc:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]

  # Ограниченный доступ к Docker API. В MVP — только чтение.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0          # Фаза 2: POST=1 + ALLOW_RESTARTS/ALLOW_START/ALLOW_STOP=1, IMAGES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]   # без публикации портов и без сети Traefik

networks:
  internal:
    internal: true
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  pgdata:
